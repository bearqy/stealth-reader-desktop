name: Desktop packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            platform: mac
            arch: arm64
            bundle: release/mac-arm64/Stealth Reader.app/Contents/Resources/app.asar
          - name: macOS-x64
            os: macos-15-intel
            platform: mac
            arch: x64
            bundle: release/mac/Stealth Reader.app/Contents/Resources/app.asar
          - name: Windows-x64
            os: windows-2022
            platform: win
            arch: x64
            bundle: release/win-unpacked/resources/app.asar
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Package installers
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged version and source
        run: node scripts/verify-bundle.cjs "${{ matrix.bundle }}"
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.name }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
